<style>
/* Layout: hartă pe toată înălțimea + panou lateral de lucru (pe telefon: hartă sus, panou dedesubt) */
:root{
  --bg:#f4f5f2; --panel:#ffffff; --ink:#1d2321; --muted:#5d6763; --line:#d9ddd8;
  --ro-blue:#002b7f; --ro-yellow:#fcd116; --ro-red:#ce1126; --accent:#1f4e8c;
  --c1:#7a1420; --c2:#b8402f; --c3:#e59a6b; --c4:#f3dcc2; --nodata:#c9ccc7;
  --ok:#2f7d4f; --warn:#b7791f; --bad:#b42318;
  --f-display:"Literata", Georgia, serif;
  --f-body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#111513; --panel:#181d1b; --ink:#e7ebe8; --muted:#9aa49f; --line:#2c3431;
    --accent:#7fa8e0; --c4:#e9cfb3; --nodata:#3a413e; color-scheme:dark; }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.app{display:grid;grid-template-columns:minmax(0,1fr) 420px;height:100%}
#map{height:100%;min-height:320px;background:var(--bg)}
aside{display:flex;flex-direction:column;min-width:0;background:var(--panel);border-left:1px solid var(--line);overflow:hidden}
header{padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.flag{display:flex;gap:6px;margin-bottom:10px}
.flag i{display:block;width:34px;height:4px;border-radius:2px}
.eyebrow{font:600 11px/1.3 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font:700 24px/1.15 var(--f-display);margin:4px 0 0;text-wrap:balance}
.subtitle{font:500 14px/1.3 var(--f-body);color:var(--muted);margin-top:2px}
nav{display:flex;gap:4px;padding:10px 12px;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{flex:0 0 auto;border:1px solid transparent;background:none;color:var(--muted);font:600 13px var(--f-body);padding:7px 12px;border-radius:999px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--ink);color:var(--panel)}
nav button:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.body{flex:1;overflow-y:auto;padding:16px 20px 28px;display:flex;flex-direction:column;gap:18px}
.status{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:0 0 auto}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:10px}
.kpi b{display:block;font:600 19px/1.2 var(--f-mono);font-variant-numeric:tabular-nums;margin-bottom:4px}
.kpi span{font-size:12px;color:var(--muted)}
h2{font:700 16px/1.3 var(--f-display);margin:0}
.section{display:flex;flex-direction:column;gap:10px}
.legend{display:flex;flex-direction:column;gap:6px;font-size:13px}
.legend div{display:flex;gap:8px;align-items:center}
.sw{width:14px;height:14px;border-radius:3px;flex:0 0 auto;border:1px solid rgba(0,0,0,.15)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr.sel td{background:color-mix(in srgb,var(--accent) 12%,transparent)}
tbody tr{cursor:pointer}
.tablewrap{overflow-x:auto;max-height:420px;overflow-y:auto;border:1px solid var(--line);border-radius:8px}
.chip{display:inline-block;font:600 11px var(--f-body);padding:2px 8px;border-radius:999px;white-space:nowrap}
.chip.k1{background:var(--c1);color:#fff}.chip.k2{background:var(--c2);color:#fff}
.chip.k3{background:var(--c3);color:#3a1a0c}.chip.k4{background:var(--c4);color:#3a1a0c}.chip.k0{background:var(--nodata);color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);font:600 13px var(--f-body);padding:8px 12px;border-radius:8px;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
select,input[type=number]{font:500 14px var(--f-body);padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.groups{display:flex;flex-direction:column;gap:8px}
.group{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;cursor:pointer}
.group.active{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.group .sw{width:16px;height:16px}
.group .name{font-weight:700}
.group .meta{grid-column:2/4;font-size:12px;color:var(--muted)}
.group .pop{font:600 14px var(--f-mono);font-variant-numeric:tabular-nums}
.below{color:var(--bad)}
table.ind td{padding:5px 8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;align-self:flex-start;flex-wrap:wrap}
.segbtn{border:0;background:none;color:var(--muted);font:600 12px var(--f-body);padding:6px 10px;border-radius:999px;cursor:pointer}
.segbtn[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.lead{display:flex;flex-direction:column;gap:6px}
.lead .big{font:700 44px/1 var(--f-display);letter-spacing:-.01em}
.lead p{margin:0;font-size:15px}
.zones{display:flex;flex-direction:column;gap:12px}
.zrow{display:flex;flex-direction:column;gap:5px;cursor:pointer}
.zhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.zhead .zval{margin-left:auto;font:600 16px var(--f-mono);font-variant-numeric:tabular-nums}
.bar{position:relative;height:10px;border-radius:5px;background:color-mix(in srgb,var(--ink) 8%,transparent)}
.bar span{display:block;height:100%;border-radius:5px}
.bar i{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
.bar em{position:absolute;left:0;top:0;height:100%;border:1.5px solid var(--ink);border-radius:5px;opacity:.45;box-sizing:border-box}
details.ip{border:1px solid var(--line);border-radius:8px;padding:8px 12px}
details.ip summary{cursor:pointer;font-weight:600;font-size:13px}
.ipgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}
.ipgrid input{width:100%}
.findings{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.kpi span{line-height:1.35}table.ind td:first-child{color:var(--muted)}
.detail{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.detail .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.note{font-size:12px;color:var(--muted)}
.hint{font-size:13px;background:color-mix(in srgb,var(--ro-yellow) 22%,transparent);border-radius:8px;padding:8px 10px}
.leaflet-container{font-family:var(--f-body)}
.lbl{background:none;border:none;box-shadow:none;font:700 12px var(--f-body);color:#111;text-shadow:0 0 3px #fff,0 0 3px #fff}
.lbl::before{display:none}
.leaflet-tooltip.tt{font:13px var(--f-body)}
@media (max-width:520px){ .kpis{grid-template-columns:1fr} }
@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:55vh auto;height:auto}
  aside{border-left:0;border-top:1px solid var(--line);overflow:visible}
  .body{overflow:visible;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  header{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function norm(s){
  return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase()
    .replace(/^(comuna|orasul|oras|municipiul|municipiu)\s+/,"").replace(/[^a-z]/g,"");
}
function lev(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n];}
function matchUAT(name){
  const k=norm(name); if(byKey.has(k)) return byKey.get(k);
  let best=null,bd=3; for(const u of UAT){const d=lev(k,u.key); if(d<bd){bd=d;best=u;}} return best;
}
const fmt = n => n==null||isNaN(n) ? "–" : Math.round(n).toLocaleString("ro-RO");
const fmtLei = n => n==null||isNaN(n) ? "–" : (Math.abs(n)>=1e6 ? (n/1e6).toLocaleString("ro-RO",{maximumFractionDigits:2})+" mil." : Math.round(n).toLocaleString("ro-RO"));
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function parseNum(v){
  if(v==null) return NaN; let s=String(v).trim().replace(/\s|lei/gi,""); if(!s) return NaN;
  if(s.includes(",")&&s.includes(".")){ s = s.lastIndexOf(",")>s.lastIndexOf(".") ? s.replace(/\./g,"").replace(",",".") : s.replace(/,/g,""); }
  else if(s.includes(",")) s = /,\d{3}$/.test(s)&&s.split(",").length>2 ? s.replace(/,/g,"") : s.replace(",",".");
  else if((s.match(/\./g)||[]).length>1) s=s.replace(/\./g,"");
  return parseFloat(s);
}

function category(v,pa,pt,f){
  if([v,pa,pt,f].some(x=>x==null||isNaN(x))) return 0;
  if(v<pa) return 1; if(v<pt) return 2; if(v<f) return 3; return 4;
}
function uatCat(u){ return u.fin ? category(u.fin.v,u.fin.pa,u.fin.pt,u.fin.f) : 0; }
/* Acoperirea funcționării proprii = venituri proprii / (funcționare − cheltuieli descentralizate finanțate din TVA 11.02) */
const NCAT = [
  {k:0,label:"Fără date",hex:"#c9ccc7",ink:"#1d2321"},
  {k:1,label:"Sub 50% din funcționarea proprie",hex:"#7a1420",ink:"#fff"},
  {k:2,label:"50–75% din funcționarea proprie",hex:"#c4553f",ink:"#fff"},
  {k:3,label:"75–100% din funcționarea proprie",hex:"#e9b07a",ink:"#3a1a0c"},
  {k:4,label:"Peste 100%: se finanțează singură",hex:"#3f8f5a",ink:"#fff"}
];
function netRatio(fin){ return fin && fin.tvd!=null ? fin.v/(fin.f-fin.tvd) : NaN; }
function netCat(r){ return isNaN(r)?0 : r<.5?1 : r<.75?2 : r<1?3 : 4; }
function curCats(){ return S.metric==="net" ? NCAT : CAT; }
function curCat(u){ return S.metric==="net" ? netCat(netRatio(u.fin)) : uatCat(u); }
function chip(u,short){
  const c=curCats()[curCat(u)]; if(!u.fin) return `<span class="chip k0">fără date</span>`;
  const extra = S.metric==="net" ? ` ${(netRatio(u.fin)*100).toFixed(0)}%` : "";
  const label = short ? (S.metric==="net" ? (["","sub 50%","50–75%","75–100%","peste 100%"][c.k]) : c.label.replace("Acoperă ","").replace("Nu acoperă nici ","nu acoperă ")) : c.label;
  return `<span class="chip" style="background:${c.hex};color:${c.ink||(c.k>=3?"#3a1a0c":"#fff")}">${esc(label)}${short&&S.metric==="net"?"":extra}</span>`;
}

/* ---------- Geografie: vecinătăți și distanțe ---------- */
/* Vecinătăți calculate din contururi (graniță comună de cel puțin 200 m) și centrele UAT (lon, lat). */
function adjOf(key){ return S.adjacency?.get(key) || ADJ_KEYS.get(key) || new Set(); }
function contiguous(keys){
  const ks=[...keys]; if(ks.length<2) return true; const set=new Set(ks), seen=new Set([ks[0]]), q=[ks[0]];
  while(q.length){ const k=q.pop(); for(const n of adjOf(k)) if(set.has(n)&&!seen.has(n)){ seen.add(n); q.push(n); } }
  return seen.size===set.size;
}
function km(a,b){
  const A=CENTRE[byKey.get(a).name], B=CENTRE[byKey.get(b).name]; if(!A||!B) return NaN;
  const R=6371, r=Math.PI/180, dLat=(B[1]-A[1])*r, dLon=(B[0]-A[0])*r;
  const h=Math.sin(dLat/2)**2+Math.cos(A[1]*r)*Math.cos(B[1]*r)*Math.sin(dLon/2)**2; return 2*R*Math.asin(Math.sqrt(h));
}
/* Reședința: municipiul sau cel mai mare oraș din grupare; altfel comuna cea mai centrală (cea mai mică distanță maximă). */
function seatOf(keys,pref){
  const us=[...keys].map(k=>byKey.get(k)); if(!us.length) return null;
  if(pref && keys.has(pref)) return pref;
  const towns=us.filter(u=>u.tip!=="C").sort((a,b)=>b.pop-a.pop); if(towns.length) return towns[0].key;
  let best=null,bd=Infinity; for(const u of us){ const d=Math.max(...us.map(o=>km(u.key,o.key)||0)); if(d<bd-0.01||(Math.abs(d-bd)<0.01&&u.pop>byKey.get(best).pop)){bd=d;best=u.key;} }
  return best;
}

/* ---------- Modelul de economii la comasare ----------
   Pentru fiecare primărie absorbită (toate, mai puțin reședința):
   1. dispare stratul de conducere: primar, viceprimar, secretar general (indemnizații/salarii brute lunare + CAM 2,25%)
      și posturile dublate de suport (contabil-șef, achiziții, juridic, resurse umane etc.); plafonat la un procent din aparatul acelei primării,
      pentru că ghișeele (registru agricol, stare civilă, taxe, asistență socială) rămân ca birou local;
   2. scade numărul total de consilieri locali (art. 112 Codul administrativ: numărul se stabilește după populație);
   3. funcționare: dispar costurile proprii ale unei primării separate (licențe software, audit, servicii juridice, autoturism, bancă, IT);
   4. se scade costul armonizării salariale: personalul preluat trece pe grila (mai mare) a noii UAT.
   Opțional: îmbunătățirea colectării impozitelor locale printr-un serviciu unic de taxe (implicit 0%). */
const CAM = 1.0225;
const IPOTEZE_DEF = {primar:15000, viceprimar:10600, secretar:12000, posturi:3, salariu:9000, consilier:1200, plafon:60, functionare:120000, armonizare:5, colectare:0};
function nrConsilieri(p){ for(const [lim,n] of [[1500,9],[3000,11],[5000,13],[10000,15],[20000,17],[50000,19],[100000,21],[200000,23]]) if(p<=lim) return n; return 27; }
function stratConducere(u){
  const I=S.ip; const s=(I.primar+I.viceprimar+I.secretar+I.posturi*I.salariu)*12*CAM;
  return Math.min(s, I.plafon/100*u.fin.pa);
}
function groupStats(keys,seatPref){
  keys = keys instanceof Set ? keys : new Set(keys);
  const us=[...keys].map(k=>byKey.get(k)); const pop=us.reduce((s,u)=>s+u.pop,0);
  const hasFin = us.length>0 && us.every(u=>u.fin);
  const sum=f=>us.reduce((s,u)=>s+(u.fin?u.fin[f]:0),0);
  const seat=seatOf(keys,seatPref);
  let v=NaN,pa=NaN,pt=NaN,f=NaN,econ=0,eP=0,eC=0,eF=0,eA=0,colect=0,consB=0,consA=0;
  if(hasFin){
    v=sum("v"); pa=sum("pa"); pt=sum("pt"); f=sum("f");
    consB=us.reduce((s,u)=>s+nrConsilieri(u.pop),0); consA=us.length>1?nrConsilieri(pop):consB;
    if(us.length>1){
      const abs=us.filter(u=>u.key!==seat);
      eP=abs.reduce((s,u)=>s+stratConducere(u),0);
      eC=Math.max(0,consB-consA)*S.ip.consilier*12*CAM;
      eA=S.ip.armonizare/100*(abs.reduce((s,u)=>s+u.fin.pa,0)-eP);
      eF=S.ip.functionare*abs.length;
      econ=eP+eC+eF-eA;
      colect=S.ip.colectare/100*us.reduce((s,u)=>s+(u.fin.v-(u.fin.pit||0)),0);
      v+=colect; pa+=-eP-eC+eA; pt+=-eP-eC+eA; f-=econ;
    }
  }
  const opt=k=>us.every(u=>u.fin&&u.fin[k]!=null&&!isNaN(u.fin[k]))?sum(k):NaN;
  const area=us.every(u=>u.area)?us.reduce((s,u)=>s+u.area,0):NaN;
  const tvd=opt("tvd");
  const dmax=seat&&us.length>1?Math.max(...us.map(u=>km(u.key,seat)||0)):0;
  return {pop,n:us.length,hasFin,v,pa,pt,f,econ,eP,eC,eF,eA,colect,consB,consA,seat,dmax,contig:contiguous(keys),
    cat:hasFin?category(v,pa,pt,f):0,cover:hasFin? v/f : NaN,
    pit:opt("pit"),eq:opt("eq"),dev:opt("dev"),tv:opt("tv"),tc:opt("tc"),tvd,area,deficit:hasFin? f-v : NaN,
    fNet:hasFin? f-tvd : NaN, coverNet:hasFin? v/(f-tvd) : NaN,
    coverNetNow:hasFin? sum("v")/(sum("f")-tvd) : NaN};
}
function gStats(g){ return groupStats(g.members,g.seat); }
function groupOf(key){ return S.groups.find(g=>g.members.has(key)); }

/* ============================================================
   5. CONTURURI UAT
   Ordinea: (a) fișier local braila_uat.geojson din același folder,
            (b) OpenStreetMap prin Overpass API, (c) fișier încărcat de utilizator.
   ============================================================ */
const OVERPASS = ["https://overpass-api.de/api/interpreter","https://overpass.private.coffee/api/interpreter","https://maps.mail.ru/osm/tools/overpass/api/interpreter"];
const QUERY = `[out:json][timeout:120];
(area["ISO3166-2"="RO-BR"];area["name"~"Brăila"]["admin_level"="4"]["boundary"="administrative"];)->.j;
rel(area.j)["boundary"="administrative"]["admin_level"~"^(6|7|8)$"];
out geom;`;

function assembleRings(ways){
  const pool = ways.filter(w=>w.geometry&&w.geometry.length>1).map(w=>w.geometry.map(p=>[p.lon,p.lat]));
  const same=(a,b)=>a[0]===b[0]&&a[1]===b[1]; const rings=[];
  while(pool.length){
    let cur=pool.shift();
    let guard=0;
    while(!same(cur[0],cur[cur.length-1]) && guard++<10000){
      const end=cur[cur.length-1]; let found=-1, rev=false;
      for(let i=0;i<pool.length;i++){
        if(same(pool[i][0],end)){found=i;break;}
        if(same(pool[i][pool[i].length-1],end)){found=i;rev=true;break;}
      }
      if(found<0) break;
      let w=pool.splice(found,1)[0]; if(rev) w=w.slice().reverse();
      cur=cur.concat(w.slice(1));
    }
    if(!same(cur[0],cur[cur.length-1])) cur.push(cur[0]);
    if(cur.length>=4) rings.push(cur);
  }
  return rings;
}
function pointInRing(pt,ring){
  let inside=false;
  for(let i=0,j=ring.length-1;i<ring.length;j=i++){
    const [xi,yi]=ring[i],[xj,yj]=ring[j];
    if(((yi>pt[1])!==(yj>pt[1])) && (pt[0] < (xj-xi)*(pt[1]-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}
function relationToFeature(rel){
  const outers=assembleRings(rel.members.filter(m=>m.type==="way"&&m.role!=="inner"));
  const inners=assembleRings(rel.members.filter(m=>m.type==="way"&&m.role==="inner"));
  if(!outers.length) return null;
  const polys=outers.map(o=>[o]);
  for(const h of inners){ const p=polys.find(pl=>pointInRing(h[0],pl[0])); if(p) p.push(h); }
  return {type:"Feature",properties:{name:rel.tags.name,admin_level:rel.tags.admin_level,siruta:rel.tags["ref:siruta"]||null},
    geometry: polys.length===1 ? {type:"Polygon",coordinates:polys[0]} : {type:"MultiPolygon",coordinates:polys}};
}
function osmToGeoJSON(json){
  const feats=[];
  for(const el of json.elements||[]) if(el.type==="relation"&&el.members){ const f=relationToFeature(el); if(f) feats.push(f); }
  return {type:"FeatureCollection",features:feats};
}

async function loadGeometry(){
  // (a) fișier local
  try{ const r=await fetch("braila_uat.geojson",{cache:"no-cache"}); if(r.ok){ const gj=await r.json(); if(applyGeo(gj,"fișierul braila_uat.geojson")) return; } }catch(e){}
  // cache în browser
  try{ const c=localStorage.getItem("simuat.geo"); if(c && applyGeo(JSON.parse(c),"copia salvată în browser")) return; }catch(e){}
  // (b) OpenStreetMap
  const errs=[];
  for(const [i,url] of OVERPASS.entries()){
    const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),90000);
    try{
      setGeoStatus(`Descarc contururile din OpenStreetMap (server ${i+1} din ${OVERPASS.length}), poate dura până la un minut…`,null);
      const r=await fetch(url,{method:"POST",body:"data="+encodeURIComponent(QUERY),headers:{"Content-Type":"application/x-www-form-urlencoded"},signal:ctl.signal});
      if(!r.ok) throw new Error("HTTP "+r.status);
      const gj=osmToGeoJSON(await r.json());
      if(applyGeo(gj,"OpenStreetMap")){ try{ localStorage.setItem("simuat.geo",JSON.stringify(gj)); }catch(e){} return; }
      errs.push(`server ${i+1}: doar ${gj.features.length} contururi`);
    }catch(e){ errs.push(`server ${i+1}: ${e.name==="AbortError"?"timp depășit":e.message}`); console.warn("Overpass",url,e); }
    finally{ clearTimeout(t); }
  }
  setGeoStatus(`Contururile nu s-au putut încărca (${errs.join("; ")}). Reîncearcă din fila Date sau încarcă un GeoJSON.`,false);
}

let geoLayer=null, labelLayer=null, map=null, lastGeo=null;
const BY_SIRUTA = new Map(Object.entries(SIRUTA).map(([n,c])=>[String(c),n]));
function sirutaOf(props){
  // caută în proprietăți un cod SIRUTA al unui UAT din Brăila (coloane uzuale: siruta, SIRUTA, natCode, code, id)
  for(const [k,v] of Object.entries(props||{})){
    if(v==null||typeof v==="object") continue;
    const s=String(v).replace(/\.0+$/,"").trim();
    if(BY_SIRUTA.has(s) && /siruta|code|cod|id|uat/i.test(k)) return BY_SIRUTA.get(s);
  }
  return null;
}
function looksWGS84(f){
  try{ let c=f.geometry.coordinates; while(Array.isArray(c[0])) c=c[0]; return Math.abs(c[0])<=180&&Math.abs(c[1])<=90; }catch(e){ return false; }
}
function applyGeo(gj,source,sirutaOnly){
  const feats=(gj.features||[]).filter(f=>f&&f.geometry); let matched=0;
  if(!feats.length||!looksWGS84(feats[0])) return false;
  const prev=UAT.map(u=>u.feature);
  UAT.forEach(u=>{u.feature=null;});
  for(const f of feats){
    const props=f.properties||{};
    let u=null; const bySir=sirutaOf(props); if(bySir) u=matchUAT(bySir);
    if(!u){
      if(sirutaOnly) continue;
      const nm=props.name||props.NAME||props.nume||props.UAT||props.natLevName; u=matchUAT(nm);
    }
    if(!u) continue;
    if(u.feature){ // păstrează conturul cu nivelul administrativ cel mai potrivit (8 = UAT)
      if(String(f.properties.admin_level)!=="8") continue;
    }
    u.feature={type:"Feature",properties:{key:u.key,name:u.name},geometry:f.geometry};
  }
  matched=UAT.filter(u=>u.feature).length;
  if(matched<30){ UAT.forEach((u,i)=>{u.feature=prev[i];}); return false; }
  UAT.forEach(u=>{ u.area = u.feature ? featureAreaKm2(u.feature.geometry) : null; });
  lastGeo={type:"FeatureCollection",features:UAT.filter(u=>u.feature).map(u=>u.feature)};
  buildAdjacency(); drawGeo();
  setGeoStatus(`${matched} din 44 UAT au contur (sursa: ${source}).`, matched===44);
  return true;
}
function ringAreaKm2(r){
  const R=6378.137, rad=Math.PI/180; let a=0;
  for(let i=0;i<r.length-1;i++){ const [x1,y1]=r[i],[x2,y2]=r[i+1]; a+=(x2-x1)*rad*(2+Math.sin(y1*rad)+Math.sin(y2*rad)); }
  return Math.abs(a*R*R/2);
}
function featureAreaKm2(g){
  const polys=g.type==="Polygon"?[g.coordinates]:g.type==="MultiPolygon"?g.coordinates:[];
  return polys.reduce((s,p)=>s+ringAreaKm2(p[0])-p.slice(1).reduce((h,r)=>h+ringAreaKm2(r),0),0);
}
function setGeoStatus(t,ok){ S.geoStatus=t; S.geoOk=ok; render(); }

/* Vecinătăți: două UAT sunt vecine dacă au cel puțin două noduri de graniță comune. */
function buildAdjacency(){
  const pts=new Map();
  for(const u of UAT){ if(!u.feature) continue; const set=new Set(); const g=u.feature.geometry;
    const polys=g.type==="Polygon"?[g.coordinates]:g.coordinates;
    for(const p of polys) for(const r of p) for(const c of r) set.add(c[0].toFixed(5)+","+c[1].toFixed(5));
    pts.set(u.key,set); }
  const adj=new Map(UAT.map(u=>[u.key,new Set()]));
  const keys=[...pts.keys()];
  for(let i=0;i<keys.length;i++) for(let j=i+1;j<keys.length;j++){
    const A=pts.get(keys[i]),B=pts.get(keys[j]); const [s,l]=A.size<B.size?[A,B]:[B,A]; let c=0;
    for(const x of s){ if(l.has(x)&&++c>=2) break; }
    if(c>=2){ adj.get(keys[i]).add(keys[j]); adj.get(keys[j]).add(keys[i]); }
  }
  S.adjacency=adj;
}

function initMap(){
  map=L.map("map",{zoomControl:true,attributionControl:true}).setView([45.08,27.62],9);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{

    maxZoom:16, opacity:.55}).addTo(map);
}
function isSeat(u){ const gs=S.mode==="summary"?SUMMARY:(S.mode==="edit"||S.mode==="auto")?S.groups:null; if(!gs) return false; const g=gs.find(z=>z.members.has(u.key)); return !!g&&g.members.size>1&&gStats(g).seat===u.key; }
function styleFor(u){
  let fill="#c9ccc7", op=.82;
  if(S.mode==="actual"||S.mode==="data"){ fill=curCats()[curCat(u)].hex; if(!u.fin){ fill=popColor(u.pop); } }
  else if(S.mode==="summary"){ const g=SUMMARY.find(z=>z.members.has(u.key)); fill=g?g.color:"#e8e9e6"; op=.85; }
  else { const g=groupOf(u.key); fill=g?g.color:"#e8e9e6"; op=g?.85:.5; }
  const sel = S.mode==="edit" && S.activeGroup && groupOf(u.key)?.id===S.activeGroup;
  const seat = S.mode!=="actual" && S.mode!=="data" && isSeat(u);
  return {color: sel?"#111":seat?"#1d2321":"#ffffff", weight: sel?2.2:seat?2:.9, dashArray: seat&&!sel?"4 3":null, fillColor:fill, fillOpacity:op};
}
function popColor(p){ return p>=10000?"#2c5d8f": p>=5000?"#5f8fc0": p>=3000?"#9dbbdb": p>=2000?"#c9d9ea":"#e7eef6"; }
function drawGeo(){
  if(!map) return;
  if(geoLayer) geoLayer.remove();
  geoLayer=L.geoJSON(lastGeo,{
    style:f=>styleFor(byKey.get(f.properties.key)),
    onEachFeature:(f,layer)=>{
      const u=byKey.get(f.properties.key); u.layer=layer;
      layer.bindTooltip(()=>tooltipHtml(u),{sticky:true,className:"tt"});
      layer.on("click",()=>onUatClick(u.key));

  }).addTo(map);
  map.fitBounds(geoLayer.getBounds(),{padding:[16,16]});
  drawLabels();
}
function restyle(){ if(geoLayer) geoLayer.eachLayer(l=>l.setStyle(styleFor(byKey.get(l.feature.properties.key)))); drawLabels(); }
function drawLabels(){
  if(!map||!geoLayer) return; if(labelLayer) labelLayer.remove(); labelLayer=L.layerGroup().addTo(map);
  if(S.mode==="edit"||S.mode==="auto"||S.mode==="summary"){
    for(const g of (S.mode==="summary"?SUMMARY:S.groups)){ if(g.members.size<2) continue;
      const b=L.latLngBounds([]); g.members.forEach(k=>{const l=byKey.get(k).layer; if(l) b.extend(l.getBounds());});
      if(!b.isValid()) continue; const st=gStats(g);
      const sl=st.seat&&byKey.get(st.seat).layer; const at=sl?sl.getBounds().getCenter():b.getCenter();
      L.tooltip({permanent:true,direction:"center",className:"lbl"}).setLatLng(at)
        .setContent(`★ ${esc(g.name)}<br>${fmt(st.pop)} loc.${st.contig?"":"<br>⚠ necontinuă"}`).addTo(labelLayer);
    }
  }
}
function tooltipHtml(u){
  const g=groupOf(u.key); const c=uatCat(u);
  let h=`<b>${esc(u.name)}</b> · ${u.tip==="M"?"municipiu":u.tip==="O"?"oraș":"comună"}<br>${fmt(u.pop)} locuitori (2021)`;
  if(u.fin) h+=`<br>${chip(u)}<br>Venituri proprii: ${fmtLei(u.fin.v)} lei<br>Funcționare: ${fmtLei(u.fin.f)} lei<br>Finanțat din transferuri: ${fmtLei(u.fin.f-u.fin.v)} lei${u.fin.tvd!=null?`<br>Acoperire fără descentralizate: ${(u.fin.v/(u.fin.f-u.fin.tvd)*100).toFixed(0)}%`:""}`;
  if(g && (S.mode==="edit"||S.mode==="auto")) h+=`<br>Grupare: <b>${esc(g.name)}</b>`;
  if(S.mode==="summary"){ const z=SUMMARY.find(z=>z.members.has(u.key)); if(z) h+=`<br>Zona propusă: <b>${esc(z.name)}</b>`; }
  return h;
}
function onUatClick(key){
  if(S.mode==="summary"){ S.selected=key; S.mode="actual"; restyle(); render(); panel.scrollTop=0; return; }
  if(S.mode!=="edit"){ S.selected=key; if(S.mode!=="actual"){ const g=groupOf(key); if(g) S.openGroup=g.id; } render(); panel.scrollTop=0; return; }
  if(!S.activeGroup){ newGroup(byKey.get(key).name,[key]); return; }
  const g=S.groups.find(x=>x.id===S.activeGroup); const prev=groupOf(key);
  if(prev===g){ prev.members.delete(key); }
  else { if(prev) prev.members.delete(key); g.members.add(key); }
  cleanupGroups(); save(); restyle(); render();
}

let gid=1;
function newGroup(name,keys){
  keys.forEach(k=>{const p=groupOf(k); if(p) p.members.delete(k);});
  const g={id:"g"+(gid++)+"_"+Date.now().toString(36),name,color:PALETTE[S.groups.length%PALETTE.length],members:new Set(keys)};
  S.groups.push(g); S.activeGroup=g.id; cleanupGroups(); save(); restyle(); render(); return g;
}
function cleanupGroups(){
  S.groups=S.groups.filter(g=>g.members.size>0);
  if(S.activeGroup && !S.groups.find(g=>g.id===S.activeGroup)) S.activeGroup=null;
}
function singletons(){
  S.groups=UAT.map((u,i)=>({id:"s"+i,name:u.name,color:PALETTE[i%PALETTE.length],members:new Set([u.key])}));

/* Propunerea oficială, independentă de grupările editate de vizitator */
const mkZones=(preset)=>preset.map((z,i)=>({id:"z"+i,name:z.name,seat:matchUAT(z.seat).key,color:PALETTE[i%PALETTE.length],members:new Set(z.members.map(n=>matchUAT(n).key))}));
const SUMMARY = mkZones(PRESET_OPT);
const OLD5 = mkZones(PRESET_VECHI);
function pct(x){ return isNaN(x)?"–":(x*100).toFixed(0)+"%"; }
function scenarioTotals(zones){
  const st=zones.map(z=>groupStats(z.members,z.seat));
  const s=k=>st.reduce((a,x)=>a+x[k],0);

  return {st,econ:s("econ"),eP:s("eP"),eC:s("eC"),eF:s("eF"),eA:s("eA"),colect:s("colect"),
    consB:s("consB"),consA:s("consA"),minCov:Math.min(...rural.map(x=>x.coverNet)),dmax:Math.max(...st.map(x=>x.dmax)),
    allContig:st.every(x=>x.contig)};
}
function summaryHtml(){
  if(!UAT.every(u=>u.fin)) return `<p class="note">Se încarcă datele financiare…</p>`;
  const zs=SUMMARY.map(z=>{ const st=groupStats(z.members,z.seat); const parts=[...z.members].map(k=>byKey.get(k));

    return {z,st,min:Math.min(...rs),max:Math.max(...rs),n:parts.length}; })

  const T=scenarioTotals(SUMMARY), O=scenarioTotals(OLD5);

  const ruralZ=zs.filter(x=>x.st.n>1), ruralAfter=ruralZ.reduce((s,x)=>s+x.st.v,0)/ruralZ.reduce((s,x)=>s+x.st.fNet,0);

  </div>
  <div class="kpis">

    <div class="kpi"><b>${nPrim}</b><span>primării desființate ca structuri de conducere; rămân ca birouri locale</span></div>
    <div class="kpi"><b>${pct(ruralNow)} → ${pct(ruralAfter)}</b><span>cât își acoperă zona rurală din venituri proprii</span></div>
  </div>
  <div class="section"><h2>De unde vine economia</h2>
    <div class="tablewrap" style="max-height:none"><table class="ind"><tbody>
      <tr><td>Primari, viceprimari, secretari generali și posturi de suport dublate (${nPrim} primării)</td><td class="n">${fmtLei(T.eP)}</td></tr>
      <tr><td>Consilieri locali: de la ${fmt(T.consB)} la ${fmt(T.consA)}</td><td class="n">${fmtLei(T.eC)}</td></tr>

function presetGroups(zones){

  UAT.filter(u=>!used.has(u.key)).forEach((u,i)=>S.groups.push({id:"r"+i,name:u.name,color:"#9aa0a6",members:new Set([u.key])}));

}

/* Scenarii optimizate (calculate offline, model de programare liniară în numere întregi):
   pentru fiecare distanță maximă până la reședință și număr de UAT, împărțirea în teritorii continue
   care maximizează acoperirea din venituri proprii a celei mai slabe zone, apoi minimizează distanțele. */
function scenarioOptions(){
  const D=S.autoD, bs=S.autoBS;
  return SCENARII.filter(s=>s.D===D&&s.brailaSeparat===bs).sort((a,b)=>a.K-b.K);
}
function applyScenario(sc){
  const zones=sc.zones.map((z,i)=>{ const seat=matchUAT(z.seat).key; return {name:byKey.get(seat).name,seat,color:PALETTE[i%PALETTE.length],members:new Set(z.members.map(n=>matchUAT(n).key))}; })
    .sort((a,b)=>groupStats(b.members).pop-groupStats(a.members).pop);
  zones.forEach((z,i)=>z.color=PALETTE[i%PALETTE.length]);
  presetGroups(zones);
}

   CSV: uat;venituri_proprii;personal_administrativ;personal_total;cheltuieli_functionare

function parseCSV(text){
  const lines=text.replace(/\r/g,"").split("\n").filter(l=>l.trim()); if(!lines.length) return [];
  const delim=(lines[0].match(/;/g)||[]).length>=(lines[0].match(/,/g)||[]).length?";":",";
  const split=l=>{const out=[];let cur="",q=false;for(const ch of l){ if(ch==='"'){q=!q;continue;} if(ch===delim&&!q){out.push(cur);cur="";} else cur+=ch;} out.push(cur); return out.map(s=>s.trim());};
  const head=split(lines[0]).map(h=>norm(h));
  const find=(...names)=>head.findIndex(h=>names.some(n=>h.includes(n)));
  const iU=find("uat","nume","denumire","localitate"), iV=find("venit"), iPA=find("administrativ"), iPT=find("personaltotal","total"), iF=find("functionare");
  if(iU<0||iV<0) throw new Error("Lipsesc coloanele „uat” și „venituri_proprii”.");
  return lines.slice(1).map(l=>{const c=split(l); return {name:c[iU],v:parseNum(c[iV]),pa:parseNum(c[iPA]),pt:parseNum(c[iPT]),f:parseNum(c[iF])};});
}
function importFinancial(text){
  const rows=parseCSV(text); let ok=0; const miss=[];
  for(const r of rows){ const u=matchUAT(r.name); if(!u){ if(r.name) miss.push(r.name); continue; }
    if([r.v,r.pa,r.pt,r.f].some(isNaN)){ miss.push(r.name+" (valori lipsă)"); continue; }
    u.fin={...(u.fin||{}),v:r.v,pa:r.pa,pt:r.pt,f:r.f}; ok++; }
  save(); restyle(); render();
  return `${ok} UAT actualizate.` + (miss.length?` Neînțelese: ${miss.slice(0,6).join(", ")}${miss.length>6?"…":""}`:"");
}
function templateCSV(){
  return "uat;venituri_proprii;personal_administrativ;personal_total;cheltuieli_functionare\n"+
    UAT.map(u=>`${u.name};${u.fin?u.fin.v:""};${u.fin?u.fin.pa:""};${u.fin?u.fin.pt:""};${u.fin?u.fin.f:""}`).join("\n");
}
function scenarioCSV(){
  const rows=["grupare;resedinta;uat;tip;populatie_2021;economie_estimata_zona_lei"];
  for(const g of S.groups){ const st=gStats(g); for(const k of g.members){const u=byKey.get(k); rows.push(`${g.name};${byKey.get(st.seat).name};${u.name};${u.tip};${u.pop};${Math.round(st.econ)}`);} }
  rows.push(""); rows.push("grupare;nr_uat;populatie;suprafata_km2;impozit_venit_colectat;venituri_proprii;personal_administrativ;personal_total;functionare;dezvoltare;tva_cheltuieli_descentralizate;functionare_fara_descentralizate;finantat_din_transferuri;acoperire_totala;acoperire_fara_descentralizate");
  const r0=x=>isNaN(x)?"":Math.round(x);
  for(const g of S.groups){const st=groupStats(g.members); rows.push([g.name,st.n,st.pop,isNaN(st.area)?"":st.area.toFixed(1),r0(st.pit),r0(st.v),r0(st.pa),r0(st.pt),r0(st.f),r0(st.dev),r0(st.tvd),r0(st.fNet),r0(st.deficit),st.hasFin?(st.cover*100).toFixed(1)+"%":"",isNaN(st.coverNet)?"":(st.coverNet*100).toFixed(1)+"%"].join(";"));}
  return rows.join("\n");
}
function download(name,text,type){
  try{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob(["﻿"+text],{type:type||"text/csv;charset=utf-8"})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); }catch(e){}
}
async function copy(text,btn){
  try{ await navigator.clipboard.writeText(text); btn.textContent="Copiat"; }catch(e){ btn.textContent="Copierea nu e permisă aici"; }
  setTimeout(()=>{btn.textContent=btn.dataset.label;},1800);
}

      <button class="btn" id="clr">Revino la datele oficiale</button></div>
    <p class="note" id="imsg"></p>
    <p class="note">Rapoartele oficiale se descarcă din <a href="https://extranet.anaf.mfinante.gov.ro/anaf/extranet/EXECUTIEBUGETARA/Rapoarte_Forexe" target="_blank" rel="noopener">portalul de execuție bugetară al Ministerului Finanțelor</a>.</p></div>
    <div class="section"><h2>Contururi UAT</h2>
    <p class="note">Implicit se descarcă din OpenStreetMap. Poți încărca și un GeoJSON propriu (de exemplu limitele ANCPI), cu numele UAT în proprietatea <code>name</code>.</p>
    <div class="row"><label class="btn" for="gj">Încarcă GeoJSON</label><input type="file" id="gj" accept=".geojson,.json,application/geo+json" hidden>
      <button class="btn" id="sgj" ${lastGeo?"":"disabled"}>Salvează braila_uat.geojson</button>
      <button class="btn" id="rgj">Reîncarcă din OpenStreetMap</button></div>
    <p class="note">Pune fișierul <code>braila_uat.geojson</code> lângă <code>index.html</code> ca aplicația să pornească instant, fără descărcare.</p></div>`;
    panel.querySelector("#csv").onchange=async e=>{ const f=e.target.files[0]; if(!f) return; try{ panel.querySelector("#imsg").textContent=importFinancial(await f.text()); try{localStorage.setItem("simuat.manualfin","1");}catch(_){} }catch(err){ panel.querySelector("#imsg").textContent="Fișierul nu a putut fi citit: "+err.message; } };
    panel.querySelector("#tpl").onclick=()=>download("date_financiare_proprii.csv",templateCSV());
    panel.querySelector("#clr").onclick=()=>{for(const [n,f] of Object.entries(FIN_2025)){ const u=matchUAT(n); if(u) u.fin={...f}; } try{localStorage.removeItem("simuat.manualfin");}catch(_){} save(); restyle(); render();};
    panel.querySelector("#gj").onchange=async e=>{ const f=e.target.files[0]; if(!f) return; try{ const gj=JSON.parse(await f.text()); if(!applyGeo(gj,f.name)) setGeoStatus("Fișierul nu conține suficiente UAT din Brăila (verifică proprietatea name).",false); else { try{localStorage.setItem("simuat.geo",JSON.stringify(gj));}catch(_){}} }catch(err){ setGeoStatus("GeoJSON invalid: "+err.message,false);} };
    panel.querySelector("#sgj").onclick=()=>download("braila_uat.geojson",JSON.stringify(lastGeo),"application/geo+json");
    panel.querySelector("#rgj").onclick=()=>{ try{localStorage.removeItem("simuat.geo");}catch(e){} loadGeometry(); };
  }
  const mn=panel.querySelector("#mNet"), mt=panel.querySelector("#mTot");
  if(mn&&mn.addEventListener) mn.onclick=()=>{S.metric="net"; restyle(); render();};
  if(mt&&mt.addEventListener) mt.onclick=()=>{S.metric="total"; restyle(); render();};
  const cs=panel.querySelector("#closeSel"); if(cs) cs.onclick=()=>{S.selected=null; render();};
  panel.querySelectorAll("tr[data-k]").forEach(tr=>tr.onclick=()=>{
    const u=byKey.get(tr.dataset.k);
    if(S.mode==="edit") onUatClick(u.key);
    else { if(S.mode==="actual"){ S.selected=u.key; render(); panel.scrollTop=0; } if(u.layer&&map){ map.fitBounds(u.layer.getBounds(),{maxZoom:11}); } }
  });
}
function indicatorsHtml(st,merged){
  const pc=x=>isNaN(x)||!st.pop?"":`<span class="note">${fmt(x/st.pop)} lei/loc.</span>`;
  const row=(label,val,extra)=>`<tr><td>${label}</td><td class="n">${val}</td><td class="n">${extra||""}</td></tr>`;
  const lei=x=>isNaN(x)?"–":fmtLei(x);
  const def=st.deficit;
  return `<div class="tablewrap" style="max-height:none"><table class="ind"><tbody>
    ${row("Populație 2021",fmt(st.pop)+" loc.")}
    ${row("Suprafață",isNaN(st.area)?"–":st.area.toLocaleString("ro-RO",{maximumFractionDigits:1})+" km²", isNaN(st.area)?"":`<span class="note">${fmt(st.pop/st.area)} loc./km²</span>`)}
    ${row("Cote din impozitul pe venit (04.01)",lei(st.pit),pc(st.pit))}
    ${row("Sume de echilibrare de la stat și județ",lei(st.eq),pc(st.eq))}
    ${row("Venituri proprii",lei(st.v),pc(st.v))}
    ${row("Cheltuieli personal administrativ",lei(st.pa),pc(st.pa))}
    ${row("Cheltuieli personal total",lei(st.pt),pc(st.pt))}
    ${row("Cheltuieli de funcționare",lei(st.f),pc(st.f))}
    ${row("Cheltuieli de dezvoltare",lei(st.dev),pc(st.dev))}
    ${row("Sume din TVA pentru cheltuieli descentralizate",lei(st.tvd),pc(st.tvd))}
    ${row("Funcționare fără cheltuielile descentralizate",lei(st.fNet),pc(st.fNet))}
    ${row(isNaN(def)||def>=0?"Funcționare finanțată din transferuri":"Excedent","<b>"+lei(Math.abs(def))+"</b>",pc(Math.abs(def)))}
    ${row("Acoperire funcționare (totală)",isNaN(st.cover)?"–":"<b>"+(st.cover*100).toFixed(0)+"%</b>")}
    ${row("Acoperire fără cheltuieli descentralizate",isNaN(st.coverNet)?"–":"<b>"+(st.coverNet*100).toFixed(0)+"%</b>")}
  </tbody></table></div>
  <p class="note">Sume în lei, execuție bugetară 2025. Funcționare finanțată din transferuri = cheltuieli de funcționare − venituri proprii (bani deja primiți de la stat și județ). Cheltuielile descentralizate (învățământ, asistență socială, protecția copilului) sunt finanțate de stat prin sume defalcate din TVA, cod 11.02. Sursa: Ministerul Finanțelor, rapoarte COFOG3 la 31.12.2025, calcul propriu.${merged&&st.econ?` Include economia estimată după comasare: ${fmtLei(st.eP)} lei conducere și posturi dublate, ${fmtLei(st.eC)} lei consilieri (de la ${st.consB} la ${st.consA}), ${fmtLei(st.eF)} lei funcționare, minus ${fmtLei(st.eA)} lei armonizare salarială; total ${fmtLei(st.econ)} lei/an.`:""}</p>`;
}
function groupCard(g,readonly){
  const st=gStats(g);
  const names=[...g.members].map(k=>byKey.get(k)).sort((a,b)=>b.pop-a.pop).map(u=>u.name);
  const fin = st.hasFin ? `<br>Venituri ${fmtLei(st.v)} · funcționare ${fmtLei(st.f)} lei${isNaN(st.coverNet)?"":` · acoperire proprie <b>${(st.coverNet*100).toFixed(0)}%</b>${st.n>1?` (azi ${(st.coverNetNow*100).toFixed(0)}%)`:""}`}${st.n>1?`<br>Economie estimată <b>${fmtLei(st.econ)} lei/an</b> · reședința ${esc(byKey.get(st.seat).name)} · max. ${Math.ceil(st.dmax)} km`:""}` : "";
  const title = readonly ? `<span class="name">${esc(g.name)}</span>` : `<input class="rename" data-g="${g.id}" aria-label="Numele grupării" value="${esc(g.name)}" style="font:700 14px var(--f-body);border:0;background:none;color:inherit;padding:0;min-width:0;width:100%">`;
  return `<div class="group ${S.activeGroup===g.id?"active":""}" data-g="${g.id}" role="button" tabindex="0">
    <span class="sw" style="background:${g.color}"></span>${title}<span class="pop">${fmt(st.pop)}</span>
    <div class="meta">${st.contig?"":`<b class="below">Zona nu e continuă: are comune fără graniță comună cu restul. </b>`}${st.n} UAT: ${esc(names.join(", "))}${fin}</div>
    ${S.activeGroup===g.id||S.openGroup===g.id?`<div class="meta" style="cursor:default" onclick="event.stopPropagation()">${indicatorsHtml(st,st.n>1)}</div>`:""}</div>`;
}
function totalsHtml(groups){
  if(!UAT.every(u=>u.fin)) return "";
  const T=scenarioTotals(groups); const bad=groups.filter(g=>!gStats(g).contig).length;
  return `<div class="kpis"><div class="kpi"><b>${fmtLei(T.econ)}</b><span>lei/an economie estimată</span></div>
    <div class="kpi"><b>${pct(T.minCov)}</b><span>acoperire proprie în cea mai slabă zonă</span></div>
    <div class="kpi"><b class="${bad?"below":""}">${bad?bad+" zone":"Toate"}</b><span>${bad?"necontinue teritorial":"zonele sunt continue"}</span></div></div>`;
}
function ipotezeHtml(){
  const I=S.ip; const f=(k,label,step,suf)=>`<label class="f">${label}<input type="number" data-ip="${k}" value="${I[k]}" step="${step}" min="0">${suf?`<span>${suf}</span>`:""}</label>`;
  return `<details class="ip"><summary>Ipoteze de calcul pentru economii</summary>
    <div class="ipgrid">
    ${f("primar","Primar (lei brut/lună)",100)}${f("viceprimar","Viceprimar (lei brut/lună)",100)}${f("secretar","Secretar general (lei brut/lună)",100)}
    ${f("posturi","Posturi de suport dublate desființate",1)}${f("salariu","Salariu mediu pe acele posturi",100)}${f("plafon","Plafon: % maxim din aparatul primăriei absorbite",5)}
    ${f("consilier","Indemnizație consilier local (lei/lună)",50)}${f("functionare","Funcționare primărie separată (lei/an)",10000)}${f("armonizare","Armonizare salarială (% din personalul preluat)",1)}
    ${f("colectare","Creștere colectare taxe locale (%)",1)}
    </div><div class="row"><button class="btn" id="ipReset">Revino la valorile implicite</button></div>
    <p class="note">Salariile includ CAM 2,25%. Creșterea colectării se aplică impozitelor și taxelor locale (venituri proprii fără cotele din impozitul pe venit) și e 0% implicit.</p></details>`;
}
function bindIpoteze(){
  panel.querySelectorAll("[data-ip]").forEach(inp=>inp.onchange=e=>{ const v=parseFloat(e.target.value); if(!isNaN(v)&&v>=0){ S.ip[inp.dataset.ip]=v; save(); restyle(); render(); const d=panel.querySelector("details.ip"); if(d) d.open=true; } });
  const r=panel.querySelector("#ipReset"); if(r) r.onclick=()=>{ S.ip={...IPOTEZE_DEF}; save(); restyle(); render(); };
}
function exportRow(){ return `<div class="row"><button class="btn" id="dl" data-label="Descarcă CSV">Descarcă CSV</button><button class="btn" id="cp" data-label="Copiază tabelul">Copiază tabelul</button></div>`; }
function bindExport(){
  const dl=panel.querySelector("#dl"), cp=panel.querySelector("#cp");
  if(dl) dl.onclick=()=>download("scenariu_braila.csv",scenarioCSV());
  if(cp) cp.onclick=()=>copy(scenarioCSV(),cp);
}

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{ S.mode=b.dataset.mode; restyle(); render(); });

/* ============================================================
   10. PORNIRE
   ============================================================ */
S.ip={...IPOTEZE_DEF};
for(const [n,f] of Object.entries(FIN_2025)){ const u=matchUAT(n); if(u) u.fin={...f}; }
if(!load() || !S.groups.length) applyPreset();
render();
try{ initMap(); loadGeometry(); }catch(e){ setGeoStatus("Harta nu s-a putut încărca. Verifică conexiunea la internet și reîncarcă pagina.",false); }

</script>
</body>
</html>
